name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp module.json with version and URLs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg version "$VERSION" \
             --arg url "$REPO" \
             --arg manifest "$REPO/releases/latest/download/module.json" \
             --arg download "$REPO/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md scripts styles

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
